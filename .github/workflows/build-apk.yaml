name: Build NChat UI Lab APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Validate signing secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || (echo "Missing SIGNING_KEY_BASE64 repository secret" && exit 1)
          test -n "$KEY_STORE_PASSWORD" || (echo "Missing KEY_STORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD repository secret" && exit 1)
      - name: Decode permanent release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > app/release.keystore
      - name: Build signed release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NChat-UI-Lab-v3-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.repository.updated_at || '3.0' }}
          name: NChat UI Lab 3.0
          body: "Gradient glass UI, smooth transitions, and built-in updater."
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
