name: Build NChat UI Lab APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Restore persistent demo signing key
        run: |
          echo "${{ '' }}" >/dev/null
          base64 --decode .github/nchat-demo-keystore.b64 > app/release.keystore
      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare stable APK filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/nchat-ui-lab.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NChat-UI-Lab-v3-release
          path: app/build/outputs/apk/release/nchat-ui-lab.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nchat-build-${{ github.run_number }}
          name: NChat UI Lab build ${{ github.run_number }}
          body: "Gradient glass UI, smooth transitions, and built-in updater."
          files: app/build/outputs/apk/release/nchat-ui-lab.apk
          make_latest: true
          fail_on_unmatched_files: true
