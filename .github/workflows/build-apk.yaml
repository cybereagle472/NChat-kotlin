name: Build NChat APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Restore persistent demo signing key
        run: |
          base64 --decode .github/nchat-demo-keystore.b64 > app/release.keystore
      - name: Build signed release APK
        env:
          KEY_STORE_PASSWORD: NChatDemo2026!
          KEY_ALIAS: nchat-demo
          KEY_PASSWORD: NChatDemo2026!
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log
      - name: Capture build log on failure
        if: failure()
        run: |
          mkdir -p .ci
          { echo "run: $GITHUB_RUN_ID"; tail -n 500 /tmp/gradle-build.log; } > .ci/last-failure.log
          git config user.name "nchat-ci"
          git config user.email "ci@nchat.local"
          git add -f .ci/last-failure.log
          git commit -m "ci: capture build failure log [skip ci]" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Prepare stable APK filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/nchat-ui-lab.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NChat-release
          path: app/build/outputs/apk/release/nchat-ui-lab.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nchat-build-${{ github.run_number }}
          name: NChat build ${{ github.run_number }}
          body: "Kotlin + Compose client: rebuilt design system, navigation, chat list and conversation UI."
          files: app/build/outputs/apk/release/nchat-ui-lab.apk
          make_latest: true
          fail_on_unmatched_files: true
