plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

/** Backend address for this build — see nchat.properties for the precedence rules. */
def resolveApiBase(project, rootProject) {
    def fromProperties = { File file, String key ->
        if (file == null || !file.exists()) return null
        def props = new Properties()
        file.withInputStream { props.load(it) }
        return props.getProperty(key)?.trim() ?: null
    }

    def candidates = [
        project.findProperty("NCHAT_API_BASE"),
        System.getenv("NCHAT_API_BASE"),
        fromProperties(rootProject.file("local.properties"), "nchat.apiBase"),
        fromProperties(rootProject.file("nchat.properties"), "apiBase"),
    ]
    def value = candidates.find { it != null && !it.toString().trim().isEmpty() }
    return value == null ? "" : value.toString().trim().replaceAll("/+$", "")
}



android {
    namespace 'com.nchat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nchat.app"
        minSdk 24
        targetSdk 34
        versionCode 29
        versionName "1.0.21"
        resourceConfigurations += ['en']

        // The backend this build talks to, resolved once and baked into BuildConfig.
        // Precedence: -PNCHAT_API_BASE > $NCHAT_API_BASE > local.properties > nchat.properties
        // > empty (the app then asks for an address on first launch). No Kotlin source knows
        // the address: ServerConfig.effective() -> ApiClient is the single choke point, the
        // Android counterpart of the web client's VITE_API_URL -> API_BASE.
        def apiBase = resolveApiBase(project, rootProject)
        if (apiBase.isEmpty()) {
            logger.lifecycle("NCHAT_API_BASE is not set: this APK will ask for a server address on first launch.")
        } else {
            logger.lifecycle("NCHAT_API_BASE resolved from config (host hidden from logs)")
        }
        buildConfigField "String", "NCHAT_API_BASE", "\"${apiBase}\""
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEY_STORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Remote media: photos/clips in bubbles and server-hosted avatars (`media_url`,
    // `avatar_url`). Fetches over its own OkHttp client, no extra setup.
    implementation 'io.coil-kt:coil-compose:2.5.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
