# ---------------------------------------------------------------------------
# Which backend this build talks to.
#
# This file is the Android equivalent of the reference web app's VITE_API_URL
# (read once in src/lib/apiClient.ts -> API_BASE). No Kotlin source file knows
# this address: Gradle turns it into BuildConfig.NCHAT_API_BASE, and every HTTP
# and WebSocket call in the client funnels through one choke point —
# ServerConfig.effective() -> ApiClient (which also derives wss:// from it).
#
# Build-time precedence (highest first):
#   1. -PNCHAT_API_BASE=https://host      (command line / CI)
#   2. NCHAT_API_BASE=https://host        (environment variable)
#   3. nchat.apiBase in local.properties  (your machine only, git-ignored)
#   4. apiBase in this file               (the committed default)
#   5. empty                              (the app asks for an address on first launch)
#
# At runtime, Settings ▸ Server overrides all of the above for that install.
#
# To keep the address out of git entirely: blank the value below and set
# NCHAT_API_BASE as a repository Actions variable (or secret) — CI injects it
# into the build, exactly like the Cloudflare dashboard does for VITE_API_URL.
# ---------------------------------------------------------------------------
# Empty on purpose: the address is supplied by the repository's Actions variable
# NCHAT_API_BASE (Settings -> Secrets and variables -> Actions -> Variables), so it
# is not stored in git at all. Fill it in only for a local build.
apiBase=
